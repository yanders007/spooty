services:
  - type: web
    name: spooty
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api
    envVars:
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: ./config/db.sqlite
      - key: FE_PATH
        value: ../frontend/browser
      - key: DOWNLOADS_PATH
        value: ./downloads
      - key: FORMAT
        value: mp3
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_RUN
        value: "true"
